syntax = "proto3";

option csharp_namespace = "BoletoNetCore.Server.Contracts.Generated.Types";

package boletonetcore.types;

// Representa o endereço do beneficiário ou pagador.
message Endereco {
    // Nome da rua/avenida/logradouro (ex: "Rua Exemplo", "Av. Brasil").
    string logradouro_endereco = 1;

    // Número do endereço (ex: "123", "S/N").
    string logradouro_numero = 2;

    // Complemento do endereço (ex: "Apto 101", "Sala 5", "Cj 333").
    // Máximo 20 caracteres quando formatado.
    string logradouro_complemento = 3;

    // Bairro (ex: "Centro", "Jardins").
    string bairro = 4;

    // Nome da cidade (ex: "São Paulo", "Rio de Janeiro").
    string cidade = 5;

    // Sigla do estado com 2 caracteres (ex: "SP", "RJ", "MG").
    string uf = 6;

    // CEP com 8 dígitos sem formatação (ex: "01234567").
    string cep = 7;
}
