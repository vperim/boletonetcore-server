syntax = "proto3";

option csharp_namespace = "BoletoNetCore.Server.Contracts.Generated.Types";

package boletonetcore.types;

// Representa um valor monetário em reais (BRL).
message Money {
    // Unidades inteiras do valor (reais).
    // Ex: para R$ 150,50, units = 150.
    int64 units = 1;

    // Fração do valor em nano (10^-9) unidades (centavos com precisão extra).
    // Ex: para R$ 150,50, nanos = 500.000.000.
    // O valor deve estar entre -999.999.999 e +999.999.999 inclusive.
    // Se units é positivo, nanos deve ser positivo ou zero.
    // Se units é negativo, nanos deve ser negativo ou zero.
    // Se units é zero, nanos pode ser positivo, zero ou negativo.
    int32 nanos = 2;
}
