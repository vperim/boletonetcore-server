syntax = "proto3";

option csharp_namespace = "BoletoNetCore.Server.Contracts.Generated.V1";

import "google/api/annotations.proto";
import "boletonetcore/boletos/v1/enums.proto";
import "boletonetcore/boletos/v1/banco.proto";
import "boletonetcore/boletos/v1/beneficiario.proto";
import "boletonetcore/boletos/v1/boleto.proto";

package boletonetcore.boletos.v1;

// Requisição para gerar boletos.
message GerarBoletoRequest {
    // Configuração do banco com dados do beneficiário.
    Banco banco = 1;

    // Lista de boletos a serem gerados.
    repeated Boleto boletos = 2;

    // Formato de saída desejado.
    BoletoOutputFormat output_format = 3;
}

// Resposta com os boletos gerados.
message GerarBoletoResponse {
    // Conteúdo do arquivo gerado (bytes do PDF, etc).
    bytes conteudo = 1;

    // Tipo MIME do conteúdo (ex: "application/pdf").
    string content_type = 2;

    // Metadados dos boletos gerados.
    repeated BoletoGerado boletos = 3;
}

// Serviço de geração de boletos bancários.
service BoletoV1 {
    // Gera boletos com saída em PDF.
    rpc GerarBoleto(GerarBoletoRequest) returns (GerarBoletoResponse) {
        option (google.api.http) = {
            post: "/api/v1/boletos"
            body: "*"
        };
    }
}
