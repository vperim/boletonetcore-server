syntax = "proto3";

option csharp_namespace = "BoletoNetCore.Server.Contracts.Generated.V1";

import "boletonetcore/types/endereco.proto";

package boletonetcore.boletos.v1;

// Payer (debtor) information
message Pagador {
    // CPF (11 digits) or CNPJ (14 digits) without formatting
    string cpf_cnpj = 1;

    // Payer name
    string nome = 2;

    // Payer address
    boletonetcore.types.Endereco endereco = 3;

    // Phone number (required for some banks like Sicredi)
    string telefone = 4;

    // Observations
    string observacoes = 5;
}
