syntax = "proto3";

option csharp_namespace = "BoletoNetCore.Server.Contracts.Generated.V1";

import "boletonetcore/types/endereco.proto";

package boletonetcore.boletos.v1;

// Dados do pagador (sacado/devedor) - pessoa física ou jurídica que deve pagar o boleto.
message Pagador {
    // CPF (11 dígitos) ou CNPJ (14 dígitos) sem formatação.
    // O sistema remove automaticamente pontos, hífens e barras.
    string cpf_cnpj = 1;

    // Nome completo ou razão social do pagador.
    string nome = 2;

    // Endereço do pagador.
    boletonetcore.types.Endereco endereco = 3;

    // Telefone do pagador.
    // Obrigatório para alguns bancos (ex: Sicredi) quando o código do pagador não é informado.
    string telefone = 4;

    // Observações adicionais (ex: matrícula do funcionário).
    string observacoes = 5;
}
