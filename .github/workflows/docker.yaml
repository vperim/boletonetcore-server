name: Docker Image

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 1.0.0 or 1.0.0-preview.1)'
        required: true
        type: string
      push:
        description: 'Push image to registry'
        required: false
        type: boolean
        default: true
      latest:
        description: 'Tag as latest (only for stable releases)'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/boletonetcore-server

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Extract and validate version
        id: version
        run: |
          # Get version from tag or input
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="${{ inputs.version }}"
          fi

          # Validate semver format (MAJOR.MINOR.PATCH[-prerelease])
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version '${VERSION}' is not valid semver (MAJOR.MINOR.PATCH[-prerelease])." >&2
            exit 1
          fi

          # Determine if this is a stable release (no prerelease suffix)
          if [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){2}$ ]]; then
            IS_STABLE="true"
          else
            IS_STABLE="false"
          fi

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "IS_STABLE=$IS_STABLE" >> $GITHUB_OUTPUT
          echo "Version: $VERSION (stable: $IS_STABLE)"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name == 'push' || inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.VERSION }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && steps.version.outputs.IS_STABLE == 'true' || inputs.latest }}

      - name: Compute build date
        run: echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./BoletoNetCore.Server/Dockerfile
          push: ${{ github.event_name == 'push' || inputs.push }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            VCS_REF=${{ github.sha }}

      - name: Publish summary
        run: |
          echo "## Docker Image" >> $GITHUB_STEP_SUMMARY
          echo "Version: \`${{ steps.version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Trigger: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Published to: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Platforms: linux/amd64" >> $GITHUB_STEP_SUMMARY
