name: CI/CD Pipeline

on:
  push:
    branches:
      - server/main
    paths:
      - 'BoletoNetCore/**'
      - 'BoletoNetCore.Playwright/**'
      - 'BoletoNetCore.Playwright.Extensions/**'
      - 'BoletoNetCore.QuestPdf/**'
      - 'BoletoNetCore.Server/**'
      - 'BoletoNetCore.Server.Contracts/**'
      - 'BoletoNetCore.Server.Tests/**'
      - 'BoletoNetCore.Server.IntegrationTests/**'
      - '*.sln'
      - '.github/workflows/**'
    tags:
      - '*'
  pull_request:
    branches:
      - server/main
    paths:
      - 'BoletoNetCore/**'
      - 'BoletoNetCore.Playwright/**'
      - 'BoletoNetCore.Playwright.Extensions/**'
      - 'BoletoNetCore.QuestPdf/**'
      - 'BoletoNetCore.Server/**'
      - 'BoletoNetCore.Server.Contracts/**'
      - 'BoletoNetCore.Server.Tests/**'
      - 'BoletoNetCore.Server.IntegrationTests/**'
      - '*.sln'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '9.0.x'
  NUGET_SOURCE: https://api.nuget.org/v3/index.json
  NUGET_DIRECTORY: ${{ github.workspace }}/nuget

jobs:
  # =============================================================================
  # TESTS
  # =============================================================================
  tests:
    name: Tests
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: |
          dotnet restore BoletoNetCore.Server.Tests/BoletoNetCore.Server.Tests.csproj
          dotnet restore BoletoNetCore.Server.IntegrationTests/BoletoNetCore.Server.IntegrationTests.csproj

      - name: Build
        run: |
          dotnet build BoletoNetCore.Server.Tests/BoletoNetCore.Server.Tests.csproj --no-restore -c Release
          dotnet build BoletoNetCore.Server.IntegrationTests/BoletoNetCore.Server.IntegrationTests.csproj --no-restore -c Release

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: |
          dotnet tool install --global Microsoft.Playwright.CLI
          playwright install chromium --with-deps

      # -------------------------------------------------------------------------
      # Unit Tests
      # -------------------------------------------------------------------------
      - name: 'Tests: BoletoNetCore.Server.Tests'
        id: server-tests
        if: always()
        continue-on-error: true
        run: |
          dotnet test BoletoNetCore.Server.Tests/BoletoNetCore.Server.Tests.csproj \
            --no-build \
            -c Release \
            --logger "trx;LogFileName=server-tests.trx" \
            --results-directory ./TestResults

      # -------------------------------------------------------------------------
      # Integration Tests
      # -------------------------------------------------------------------------
      - name: 'Integration: Middleware Tests'
        id: middleware-tests
        if: always()
        continue-on-error: true
        run: |
          dotnet test BoletoNetCore.Server.IntegrationTests/BoletoNetCore.Server.IntegrationTests.csproj \
            --no-build \
            -c Release \
            --filter "Category=Middleware" \
            --logger "trx;LogFileName=integration-middleware.trx" \
            --results-directory ./TestResults

      - name: 'Integration: Endpoints Tests'
        id: endpoints-tests
        if: always()
        continue-on-error: true
        run: |
          dotnet test BoletoNetCore.Server.IntegrationTests/BoletoNetCore.Server.IntegrationTests.csproj \
            --no-build \
            -c Release \
            --filter "Category=Endpoints" \
            --logger "trx;LogFileName=integration-endpoints.trx" \
            --results-directory ./TestResults

      - name: 'Integration: BancoCarteira Tests'
        id: bancocarteira-tests
        if: always()
        continue-on-error: true
        run: |
          dotnet test BoletoNetCore.Server.IntegrationTests/BoletoNetCore.Server.IntegrationTests.csproj \
            --no-build \
            -c Release \
            --filter "Category=BancoCarteira" \
            --logger "trx;LogFileName=integration-bancocarteira.trx" \
            --results-directory ./TestResults

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./TestResults

      - name: Fail if any tests failed
        if: always()
        run: |
          if [[ "${{ steps.server-tests.outcome }}" == "failure" ]] || \
             [[ "${{ steps.middleware-tests.outcome }}" == "failure" ]] || \
             [[ "${{ steps.endpoints-tests.outcome }}" == "failure" ]] || \
             [[ "${{ steps.bancocarteira-tests.outcome }}" == "failure" ]]; then
            echo "One or more test steps failed"
            exit 1
          fi

  # =============================================================================
  # PUBLISH NUGET (only on tag)
  # =============================================================================
  publish:
    name: Publish NuGet
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract and validate version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}

          # Validate semver format (MAJOR.MINOR.PATCH[-prerelease])
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '${VERSION}' is not valid semver (MAJOR.MINOR.PATCH[-prerelease])." >&2
            exit 1
          fi

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore BoletoNetCore.Server.Contracts/BoletoNetCore.Server.Contracts.csproj

      - name: Pack NuGet package
        run: |
          mkdir -p ${{ env.NUGET_DIRECTORY }}

          dotnet pack BoletoNetCore.Server.Contracts/BoletoNetCore.Server.Contracts.csproj \
            -c Release \
            --no-restore \
            -o ${{ env.NUGET_DIRECTORY }} \
            -p:PackageVersion=${{ steps.version.outputs.VERSION }} \
            -p:ContinuousIntegrationBuild=true

      - name: List created packages
        run: |
          echo "## NuGet Packages" >> $GITHUB_STEP_SUMMARY
          echo "Created packages:" >> $GITHUB_STEP_SUMMARY
          ls -lah ${{ env.NUGET_DIRECTORY }} >> $GITHUB_STEP_SUMMARY

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "${{ env.NUGET_DIRECTORY }}/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source ${{ env.NUGET_SOURCE }} \
            --skip-duplicate

          dotnet nuget push "${{ env.NUGET_DIRECTORY }}/*.snupkg" \
            --api-key "$NUGET_API_KEY" \
            --source ${{ env.NUGET_SOURCE }} \
            --skip-duplicate || true

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ steps.version.outputs.VERSION }}
          path: ${{ env.NUGET_DIRECTORY }}/*
          retention-days: 30
